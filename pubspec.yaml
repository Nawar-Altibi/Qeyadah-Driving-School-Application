name: qeyadah_mobile_app
description: Qeyadah driving school mobile app built on Coore with feature-first clean architecture.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  coore:
    path: packages/coore

  dio: ^5.11.0
  bot_toast: ^4.1.3
  connectivity_plus: ^6.1.4
  device_preview: ^1.3.1
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  fpdart: ^1.1.1
  freezed_annotation: ^3.1.0
  gap: ^3.0.1
  get_it: ^8.2.0
  go_router: ^16.1.0
  dotted_border: ^3.1.0
  image_picker: ^1.2.3
  injectable: ^2.5.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  loading_animation_widget: ^1.3.0
  phosphor_flutter: ^2.1.0
  pinput: ^5.0.1
  pull_to_refresh: ^2.0.0
  skeletonizer: ^2.1.0+1
  table_calendar: ^3.2.0
  typed_form_fields: ^1.3.1
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.2.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.6.0
  flutter_gen_runner: ^5.11.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.0
  freezed_lint: ^0.0.10
  injectable_generator: ^2.8.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.10.0
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env.development
    - .env.staging
    - .env.production
    - assets/images/
    - assets/l10n/

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700

flutter_gen:
  integrations:
    image: true
  assets:
    exclude:
      - .env.development
      - .env.staging
      - .env.production
